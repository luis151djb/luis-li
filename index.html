<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2游戏资料</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-container {
            text-align: center;
            padding: 40px;
            max-width: 800px;
        }
        .header {
            margin-bottom: 50px;
        }
        .header h1 {
            color: #4cc9f0;
            font-size: 42px;
            margin-bottom: 10px;
        }
        .header p {
            color: #aaa;
            font-size: 18px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .option-card {
            background-color: #16213e;
            padding: 30px 20px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            border: 2px solid #2a3b5c;
        }
        .option-card:hover {
            transform: translateY(-10px);
            border-color: #4cc9f0;
            box-shadow: 0 10px 20px rgba(76, 201, 240, 0.2);
        }
        .option-icon {
            font-size: 40px;
            margin-bottom: 15px;
            color: #4cc9f0;
        }
        .option-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .option-desc {
            color: #aaa;
            font-size: 14px;
        }
        .footer {
            margin-top: 50px;
            color: #666;
            font-size: 14px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>CS2游戏资料库</h1>
            <p>选择您想查看的内容分类</p>
        </div>
        
        <div class="options-grid">
            <a href="weapons.html" class="option-card">
                <div class="option-icon">
                    <i class="fas fa-gun"></i>
                </div>
                <div class="option-title">武器介绍</div>
                <div class="option-desc">查看所有武器数据、价格和伤害</div>
            </a>
            
            <a href="maps.html" class="option-card">
                <div class="option-icon">
                    <i class="fas fa-map"></i>
                </div>
                <div class="option-title">地图介绍</div>
                <div class="option-desc">探索CS2所有竞技地图</div>
            </a>
            
            <a href="grenades.html" class="option-card">
                <div class="option-icon">
                    <i class="fas fa-bomb"></i>
                </div>
                <div class="option-title">投掷物介绍</div>
                <div class="option-desc">学习各种战术道具使用</div>
            </a>
            
            <a href="majors.html" class="option-card">
                <div class="option-icon">
                    <i class="fas fa-trophy"></i>
                </div>
                <div class="option-title">Major冠军</div>
                <div class="option-desc">查看历代Major冠军战队</div>
            </a>
            
            <a href="gear.html" class="option-card">
                <div class="option-icon">
                    <i class="fas fa-keyboard"></i>
                </div>
                <div class="option-title">电竞外设</div>
                <div class="option-desc">推荐的专业电竞装备</div>
            </a>
        </div>
        
        <div class="footer">
            <p>CS2游戏资料站 © 2023</p>
        </div>
    </div>
</body>
</html>
